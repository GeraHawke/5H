<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigación de Operaciones - Corte de Soga Corregido</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js para la gráfica -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light py-4">

  <div class="container bg-white p-4 rounded shadow-sm">
    <h2 class="text-center mb-4 text-primary fw-bold">Optimización de Corte de Soga (10m)</h2>
    
    <!-- Tarjeta con el Resultado del Área Mínima -->
    <div id="resultado" class="alert alert-success text-center fw-bold fs-5 mb-4 shadow-sm">
      Calculando resultado óptimo...
    </div>

    <div class="row">
      <!-- Columna de la Tabla -->
      <div class="col-lg-6 mb-4">
        <h4 class="mb-3">Tabla de Resultados</h4>
        <div class="table-responsive" style="max-height: 480px; overflow-y: auto;">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark sticky-top">
              <tr>
                <th>Perímetro X (Círculo)</th>
                <th>Perímetro Y (Cuadrado)</th>
                <th>Área Circ. (m²)</th>
                <th>Área Cuad. (m²)</th>
                <th>Área Total (m²)</th>
              </tr>
            </thead>
            <tbody id="cuerpoTabla">
              <!-- Se llena dinámicamente mediante JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Columna de la Gráfica -->
      <div class="col-lg-6 mb-4">
        <h4 class="mb-3">Gráfica de Área Total vs Perímetro X</h4>
        <div class="card p-3 shadow-sm">
          <div style="position: relative; height: 400px;">
            <canvas id="graficaMinimizacion"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const totalSoga = 10.0;
      let mejorX = 0, mejorY = 0, minArea = Infinity;

      const datosPuntos = [];
      const cuerpoTabla = document.getElementById("cuerpoTabla");

      for (let x = 0; x <= 10.0; x = Number((x + 0.1).toFixed(1))) {
        let y = totalSoga - x;

        // Cálculos geométricos precisos
        let radio = x / (2 * Math.PI);
        let areaCirculo = Math.PI * Math.pow(radio, 2);

        let lado = y / 4.0;
        let areaCuadrado = Math.pow(lado, 2);

        let areaTotal = areaCirculo + areaCuadrado;

        if (areaTotal < minArea) {
          minArea = areaTotal;
          mejorX = x;
          mejorY = y;
        }

        datosPuntos.push({
          x: x, 
          y: Number(areaTotal.toFixed(4))
        });

        // Agregar fila a la tabla Bootstrap
        const fila = document.createElement("tr");
        if (Math.abs(x - 4.40) < 0.01) {
          fila.classList.add("table-warning", "fw-bold");
        }

        fila.innerHTML = `
          <td>${x.toFixed(2)} m</td>
          <td>${y.toFixed(2)} m</td>
          <td>${areaCirculo.toFixed(4)}</td>
          <td>${areaCuadrado.toFixed(4)}</td>
          <td>${areaTotal.toFixed(4)}</td>
        `;
        cuerpoTabla.appendChild(fila);
      }

      // Valores exactos calculados analíticamente
      const xOptimo = 4.3990;
      const areaOptima = 3.5006;

      document.getElementById("resultado").innerHTML = `
        🎯 ÁREA MÍNIMA ENCONTRADA:<br>
        <span class="fs-6 fw-normal">
          Perímetro Círculo (X) = <b>${xOptimo.toFixed(4)} m</b> | 
          Perímetro Cuadrado (Y) = <b>${(totalSoga - xOptimo).toFixed(4)} m</b> | 
          <b>Área Mínima = ${areaOptima.toFixed(4)} m²</b>
        </span>
      `;

      // Renderizar Gráfica con Chart.js
      const ctx = document.getElementById('graficaMinimizacion').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Punto Mínimo (Óptimo)',
              data: [{ x: xOptimo, y: areaOptima }],
              type: 'scatter',
              backgroundColor: '#dc3545', // Rojo llamativo
              borderColor: '#ffffff',
              borderWidth: 2,
              pointRadius: 8, // Tamaño del punto
              pointHoverRadius: 10,
              order: 1 // Dibuja este dataset AL FINAL (al frente de todos)
            },
            {
              label: 'Área Total (m²)',
              data: datosPuntos,
              borderColor: '#0d6efd',
              backgroundColor: 'rgba(13, 110, 253, 0.1)',
              borderWidth: 2,
              fill: true,
              tension: 0.4,
              pointRadius: 0,
              pointHitRadius: 10,
              order: 2 // Dibuja la curva detrás del punto rojo
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true }
          },
          scales: {
            x: { 
              type: 'linear',
              position: 'bottom',
              title: { display: true, text: 'Perímetro del Círculo X (m)' },
              min: 0,
              max: 10,
              ticks: { stepSize: 1 }
            },
            y: { 
              type: 'linear',
              title: { display: true, text: 'Área Total (m²)' },
              min: 3,
              max: 8
            }
          }
        }
      });
    });
  </script>
</body>
</html>
