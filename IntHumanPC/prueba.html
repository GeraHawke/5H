<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mover Caja con la Voz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    /* Área donde se moverá la caja */
    #escenario {
      width: 600px;
      height: 400px;
      background-color: #ffffff;
      border: 3px solid #333;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    /* La caja roja que se moverá */
    #caja {
      width: 60px;
      height: 60px;
      background-color: #e74c3c;
      position: absolute;
      top: 170px; /* Centrado vertical */
      left: 270px; /* Centrado horizontal */
      border-radius: 6px;
      transition: all 0.3s ease; /* Para que el movimiento sea suave */
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #27ae60;
    }

    #estado {
      font-size: 18px;
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Controla la Caja con tu Voz 🎙️</h1>
  <p>Presiona el botón y di: <b>"Derecha"</b>, <b>"Izquierda"</b>, <b>"Arriba"</b> o <b>"Abajo"</b>.</p>

  <button id="btnEscuchar">Activar Micrófono 🎙️</button>
  <div id="estado">Micrófono apagado</div>

  <div id="escenario">
    <div id="caja"></div>
  </div>

  <script>
    // Posición inicial de la caja
    let posX = 270;
    let posY = 170;
    const PASO = 50; // Píxeles que se moverá en cada comando

    const caja = document.getElementById("caja");
    const btnEscuchar = document.getElementById("btnEscuchar");
    const estado = document.getElementById("estado");

    // Verificar si el navegador soporta SpeechRecognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Tu navegador no soporta el reconocimiento de voz. Usa Google Chrome o Microsoft Edge.");
    } else {
      const reconocimiento = new SpeechRecognition();

      // Configuración del reconocimiento
      reconocimiento.lang = "es-ES"; // Idioma español
      reconocimiento.continuous = true; // Que siga escuchando continuamente
      reconocimiento.interimResults = false; // Solo procesa cuando estés seguro de la palabra

      // Evento cuando presiona el botón
      btnEscuchar.addEventListener("click", () => {
        try {
          reconocimiento.start();
          estado.textContent = "🎙️ Escuchando... Di un comando (derecha, izquierda, arriba, abajo)";
          estado.style.color = "#27ae60";
        } catch (e) {
          console.log("El micrófono ya estaba activo.");
        }
      });

      // Evento cuando escucha y procesa la voz
      reconocimiento.onresult = (event) => {
        const ultimoResultado = event.results.length - 1;
        const texto = event.results[ultimoResultado][0].transcript.toLowerCase().trim();

        console.log("Escuchado:", texto);
        estado.textContent = `Escuchado: "${texto}"`;

        // Lógica de movimiento según lo que dijiste
        if (texto.includes("derecha")) {
          posX = Math.min(posX + PASO, 540); // Límite derecho
        } else if (texto.includes("izquierda")) {
          posX = Math.max(posX - PASO, 0); // Límite izquierdo
        } else if (texto.includes("arriba")) {
          posY = Math.max(posY - PASO, 0); // Límite superior
        } else if (texto.includes("abajo")) {
          posY = Math.min(posY + PASO, 340); // Límite inferior
        }

        // Actualizar posición en pantalla
        caja.style.left = `${posX}px`;
        caja.style.top = `${posY}px`;
      };

      // Si la escucha se detiene por inactividad, se puede reiniciar sola o avisar
      reconocimiento.onend = () => {
        estado.textContent = "Micrófono en pausa. Presiona activar de nuevo.";
        estado.style.color = "#e74c3c";
      };

      reconocimiento.onerror = (event) => {
        console.error("Error de reconocimiento:", event.error);
        estado.textContent = "Error con el micrófono: " + event.error;
      };
    }
  </script>
</body>
</html>
